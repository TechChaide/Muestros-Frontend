networks:
  b2b_network:
    driver: bridge
  traefik-net:
    external: true

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: /Procesos-MDDP
    image: techchaide/procesos-mddp-frontend:1.2
    container_name: procesos-mddp_frontend_prod
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_BASE_PATH=/Procesos-MDDP
      - HOSTNAME=0.0.0.0
    networks:
      - b2b_network
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.procesos-mddp-frontend-prod.rule=Host(`apps.chaide.com`) && (PathPrefix(`/Procesos-MDDP`) || PathPrefix(`/_next`) || PathPrefix(`/favicon.ico`))"
      - "traefik.http.routers.procesos-mddp-frontend-prod.entrypoints=websecure"
      - "traefik.http.routers.procesos-mddp-frontend-prod.priority=100"
      # Note: No stripPrefix middleware for frontend so the app receives the /b2b prefix.
      - "traefik.http.routers.procesos-mddp-frontend-prod.tls=true"
      - "traefik.http.services.procesos-mddp-frontend-prod.loadbalancer.server.port=3000"

      # --- LÍNEAS AÑADIDAS ---
      # 1. Define el middleware de la lista blanca de IPs
      - "traefik.http.middlewares.lista-ips-procesos-mddp.ipwhitelist.sourceRange=127.0.0.1/32,201.234.212.234/32,201.234.220.2/32,200.41.89.176/32,204.199.158.226/32"

      # 2. Aplica el middleware al router del frontend
      - "traefik.http.routers.procesos-mddp-frontend-prod.middlewares=lista-ips-procesos-mddp"